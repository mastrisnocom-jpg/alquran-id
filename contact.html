<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak Kami — Al-Qur'anul Karim Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { darkBg: '#0b1120', darkCard: '#151e32' } } } }</script>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-darkBg dark:text-slate-100 min-h-screen flex flex-col p-4 sm:p-8">
    <div class="max-w-xl mx-auto bg-white dark:bg-darkCard p-6 sm:p-10 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl space-y-6">
        <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4">
            <h1 class="text-xl font-bold text-emerald-600 dark:text-emerald-400">Hubungi Kami</h1>
            <a href="/index.html" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:text-emerald-500 transition">← Kembali</a>
        </div>

        <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300">Jika Anda memiliki pertanyaan, saran perbaikan, atau laporan kendala terkait aplikasi ini, silakan hubungi kami melalui formulir di bawah ini:</p>

        <form onsubmit="event.preventDefault(); alert('Pesan Anda berhasil terkirim!');" class="space-y-4 text-xs">
            <div>
                <label class="block font-semibold text-slate-600 dark:text-slate-400 mb-1">Nama Lengkap</label>
                <input type="text" required placeholder="Nama Anda" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block font-semibold text-slate-600 dark:text-slate-400 mb-1">Email</label>
                <input type="email" required placeholder="mastrisnobpb@gmail.com" class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block font-semibold text-slate-600 dark:text-slate-400 mb-1">Pesan / Saran</label>
                <textarea rows="4" required placeholder="Tuliskan saran atau masukan Anda..." class="w-full px-3 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-500"></textarea>
            </div>

            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition">Kirim Pesan</button>
        </form>
    </div>
</body>
</html>
