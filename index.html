<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Qur'anul Karim — Supabase Auth Edition</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: { 950: '#022c22', 900: '#064e3b', 800: '#065f46', 600: '#059669', 500: '#10b981' },
                        darkBg: '#0b1120', darkCard: '#151e32',
                    }
                }
            }
        }
    </script>

    <!-- SUPABASE JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Scheherazade+New:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-arabic { font-family: 'Scheherazade New', serif; line-height: 2.3; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.3); border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-darkBg dark:text-slate-100 min-h-screen flex flex-col">

    <!-- Header Navbar -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-darkCard/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            
            <!-- Logo Brand -->
            <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.reload()">
                <div class="w-10 h-10 rounded-2xl bg-emerald-500/10 flex items-center justify-center text-emerald-600 font-bold text-xl">📖</div>
                <div>
                    <h1 class="text-lg font-bold leading-tight text-emerald-700 dark:text-emerald-400">Al-Qur'anul Karim</h1>
                    <p class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">Modern Digital Quran</p>
                </div>
            </div>

            <!-- Header Controls: Search, Auth, Theme -->
            <div class="flex items-center gap-2">
                <button id="btnOpenSearch" class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center hover:bg-emerald-500 hover:text-white transition" title="Cari Surah">🔍</button>
                
                <!-- Tombol Auth Login / Account (Dinamis via JS) -->
                <div id="authButtonContainer">
                    <button onclick="openAuthModal()" class="px-3 py-1.5 rounded-full bg-emerald-600 text-white font-semibold text-xs hover:bg-emerald-700 transition">
                        Masuk
                    </button>
                </div>

                <button id="themeToggle" class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center hover:bg-emerald-500 hover:text-white transition" title="Ganti Mode Mode">
                    <span id="themeIcon">☀️</span>
                </button>
            </div>

        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-5 flex-1 w-full space-y-6">

        <!-- Widget Last Read (Bookmark Cloud) -->
        <div id="lastReadWidget" class="hidden relative overflow-hidden bg-gradient-to-r from-emerald-800 to-teal-700 text-white p-5 rounded-2xl shadow-lg">
            <div class="flex justify-between items-center">
                <div>
                    <span class="text-[10px] uppercase tracking-wider font-semibold px-2.5 py-0.5 rounded-full bg-white/20 text-emerald-100">
                        ☁️ Terakhir Dibaca (<span id="userEmailTag">User</span>)
                    </span>
                    <h3 id="lastReadSurah" class="font-bold text-xl mt-1.5">-</h3>
                    <p id="lastReadAyat" class="text-xs text-emerald-100/80">Ayat -</p>
                </div>
                <button id="btnContinue" class="px-4 py-2 bg-white text-emerald-800 font-semibold text-xs rounded-xl shadow hover:bg-slate-100 transition">
                    Lanjutkan →
                </button>
            </div>
        </div>

        <!-- Filter Bahasa & Qori -->
        <div class="flex flex-wrap sm:flex-nowrap items-center justify-between gap-3 bg-white dark:bg-darkCard p-3 rounded-2xl border border-slate-200 dark:border-slate-800 text-xs">
            <div class="flex items-center gap-2 w-full sm:w-auto bg-slate-100 dark:bg-slate-800 px-3 py-2 rounded-xl">
                <span>🌐 Bahasa:</span>
                <select id="langSelect" class="bg-transparent font-medium focus:outline-none cursor-pointer w-full">
                    <option value="id.indonesian" class="dark:bg-darkCard">🇮🇩 Indonesia</option>
                    <option value="en.sahih" class="dark:bg-darkCard">🇬🇧 English</option>
                    <option value="fr.hamidullah" class="dark:bg-darkCard">🇫🇷 Français</option>
                    <option value="es.cortes" class="dark:bg-darkCard">🇪🇸 Español</option>
                    <option value="tr.yazir" class="dark:bg-darkCard">🇹🇷 Türkçe</option>
                    <option value="ur.jalandhry" class="dark:bg-darkCard">🇵🇰 اردو</option>
                    <option value="ru.kuliev" class="dark:bg-darkCard">🇷🇺 Русский</option>
                </select>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto bg-slate-100 dark:bg-slate-800 px-3 py-2 rounded-xl">
                <span>🎙️ Qori:</span>
                <select id="qoriSelect" class="bg-transparent font-medium focus:outline-none cursor-pointer w-full">
                    <option value="ar.alafasy" class="dark:bg-darkCard">Mishary Rashid Alafasy</option>
                    <option value="ar.abdurrahmaanasassudais" class="dark:bg-darkCard">Abdurrahman As-Sudais</option>
                    <option value="ar.hudhaify" class="dark:bg-darkCard">Ali Al-Hudhaify</option>
                    <option value="ar.husary" class="dark:bg-darkCard">Mahmoud Al-Hussary</option>
                </select>
            </div>
        </div>

        <!-- Area Detail Ayat Surah -->
        <section id="mainReadArea">
            <div id="surahDetail" class="bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-800 p-4 sm:p-6 min-h-[400px]">
                <div id="placeholderView" class="text-center py-16 text-slate-400">
                    <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-emerald-500/10 flex items-center justify-center text-3xl">🔍</div>
                    <p class="text-xs font-medium">Klik tombol <span class="text-emerald-600 font-bold">Cari 🔍</span> di atas untuk membaca Surah.</p>
                </div>

                <div id="surahHeader" class="hidden mb-6 text-center pb-6 border-b border-slate-200 dark:border-slate-800">
                    <span id="activeSurahNumber" class="text-[11px] font-bold px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-600 border border-emerald-500/20">SURAH NO. -</span>
                    <h2 id="activeSurahName" class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-slate-100 mt-2"></h2>
                    <p id="activeSurahTranslation" class="text-xs text-slate-500 dark:text-slate-400 mt-1"></p>
                    <div class="mt-4 flex justify-center">
                        <audio id="globalAudioPlayer" controls class="w-full max-w-md h-9 rounded-xl"></audio>
                    </div>
                </div>

                <div id="ayatContainer" class="space-y-6"></div>
            </div>
        </section>
    </main>

    <!-- MODAL SEARCH -->
    <div id="searchModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-start justify-center pt-16 px-4 hidden">
        <div class="bg-white dark:bg-darkCard w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
            <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                <input type="text" id="searchInput" placeholder="Cari surah (contoh: Al-Fatihah, 36)..." class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border-none focus:outline-none text-xs">
                <button onclick="closeSearchModal()" class="text-xs font-semibold px-3 py-2 text-slate-500">Batal</button>
            </div>
            <div id="surahList" class="p-2 max-h-[60vh] overflow-y-auto space-y-1"></div>
        </div>
    </div>

    <!-- MODAL LOGIN / REGISTER -->
    <div id="authModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-darkCard w-full max-w-md rounded-2xl p-6 shadow-2xl border border-slate-200 dark:border-slate-800">
            <div class="flex justify-between items-center mb-4">
                <h3 id="authModalTitle" class="text-base font-bold text-emerald-600 dark:text-emerald-400">Masuk ke Akun</h3>
                <button onclick="closeAuthModal()" class="text-slate-400 text-lg">✕</button>
            </div>

            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">Email</label>
                    <input type="email" id="authEmail" required placeholder="nama@email.com" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border-none focus:ring-2 focus:ring-emerald-500 text-xs">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">Password</label>
                    <input type="password" id="authPassword" required placeholder="••••••••" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border-none focus:ring-2 focus:ring-emerald-500 text-xs">
                </div>

                <button type="submit" id="btnAuthSubmit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-xs transition mt-2">
                    Masuk
                </button>
            </form>

            <div class="mt-4 text-center text-xs text-slate-400">
                <span id="authToggleText">Belum punya akun?</span>
                <button onclick="toggleAuthMode()" id="btnToggleAuth" class="text-emerald-600 dark:text-emerald-400 font-semibold ml-1 underline">
                    Daftar Akun Baru
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // 1. KREDENSIAL SUPABASE
        const SUPABASE_URL = 'https://hsiguoieyyracptyzihn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gVgGhplre86qbD-hdtWkVw_YwygkiWy';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // State Global
        let currentUser = null;
        let isRegisterMode = false;
        let allSurahs = [];
        let currentSurahNo = null;
        let selectedLang = 'id.indonesian';
        let selectedQori = 'ar.alafasy';

        // Elements
        const authModal = document.getElementById('authModal');
        const authButtonContainer = document.getElementById('authButtonContainer');
        const searchModal = document.getElementById('searchModal');
        const btnOpenSearch = document.getElementById('btnOpenSearch');
        const searchInput = document.getElementById('searchInput');
        const surahListEl = document.getElementById('surahList');
        const placeholderView = document.getElementById('placeholderView');
        const surahHeader = document.getElementById('surahHeader');
        const ayatContainer = document.getElementById('ayatContainer');
        const lastReadWidget = document.getElementById('lastReadWidget');
        const lastReadSurah = document.getElementById('lastReadSurah');
        const lastReadAyat = document.getElementById('lastReadAyat');
        const userEmailTag = document.getElementById('userEmailTag');
        const btnContinue = document.getElementById('btnContinue');
        const langSelect = document.getElementById('langSelect');
        const qoriSelect = document.getElementById('qoriSelect');

        // Initial Load
        document.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            fetchSurahList();
            checkUserSession();
        });

        // 2. LISTENERS DROPDOWN BAHASA & QORI (SEKARANG SUDAH AKTIF)
        langSelect.addEventListener('change', (e) => {
            selectedLang = e.target.value;
            if (currentSurahNo) loadSurah(currentSurahNo);
        });

        qoriSelect.addEventListener('change', (e) => {
            selectedQori = e.target.value;
            if (currentSurahNo) loadSurah(currentSurahNo);
        });

        // 3. CEK SESI LOGIN USER
        async function checkUserSession() {
            const { data: { session } } = await supabase.auth.getSession();
            updateUserUI(session ? session.user : null);

            supabase.auth.onAuthStateChange((_event, session) => {
                updateUserUI(session ? session.user : null);
            });
        }

        function updateUserUI(user) {
            currentUser = user;
            if (user) {
                authButtonContainer.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-[11px] text-slate-500 dark:text-slate-400 max-w-[100px] truncate">${user.email}</span>
                        <button onclick="handleLogout()" class="px-2.5 py-1 rounded-full bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white font-semibold text-xs transition">
                            Keluar
                        </button>
                    </div>`;
                userEmailTag.textContent = user.email.split('@')[0];
                loadBookmarkFromSupabase();
            } else {
                authButtonContainer.innerHTML = `
                    <button onclick="openAuthModal()" class="px-3 py-1.5 rounded-full bg-emerald-600 text-white font-semibold text-xs hover:bg-emerald-700 transition">
                        Masuk
                    </button>`;
                lastReadWidget.classList.add('hidden');
            }
        }

        // 4. AUTHENTICATION (LOGIN / REGISTER / LOGOUT)
        function openAuthModal() {
            authModal.classList.remove('hidden');
        }

        function closeAuthModal() {
            authModal.classList.add('hidden');
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('authModalTitle').textContent = isRegisterMode ? 'Daftar Akun Baru' : 'Masuk ke Akun';
            document.getElementById('btnAuthSubmit').textContent = isRegisterMode ? 'Daftar' : 'Masuk';
            document.getElementById('authToggleText').textContent = isRegisterMode ? 'Sudah punya akun?' : 'Belum punya akun?';
            document.getElementById('btnToggleAuth').textContent = isRegisterMode ? 'Masuk di sini' : 'Daftar Akun Baru';
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;

            try {
                if (isRegisterMode) {
                    const { error } = await supabase.auth.signUp({ email, password });
                    if (error) throw error;
                    alert('Pendaftaran berhasil! Silakan periksa email Anda atau langsung mencoba masuk.');
                } else {
                    const { error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                }
                closeAuthModal();
            } catch (err) {
                alert('Gagal Auth: ' + err.message);
            }
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            alert('Anda telah keluar.');
        }

        // 5. SUPABASE: SIMPAN BOOKMARK
        async function saveBookmarkToSupabase(surahNo, surahName, ayatNo) {
            if (!currentUser) {
                alert('Silakan MASUK/LOGIN terlebih dahulu untuk menyimpan bookmark ke akun Anda.');
                openAuthModal();
                return;
            }

            try {
                await supabase.from('bookmarks').delete().eq('user_id', currentUser.id);

                const { error } = await supabase.from('bookmarks').insert([
                    {
                        user_id: currentUser.id,
                        surah_no: surahNo,
                        surah_name: surahName,
                        ayat_no: ayatNo
                    }
                ]);

                if (error) throw error;

                alert(`Bookmark tersimpan di akun Anda: ${surahName} ayat ${ayatNo}`);
                loadBookmarkFromSupabase();
            } catch (err) {
                alert('Gagal menyimpan bookmark: ' + err.message);
            }
        }

        // 6. SUPABASE: BACA BOOKMARK
        async function loadBookmarkFromSupabase() {
            if (!currentUser) return;

            try {
                const { data, error } = await supabase
                    .from('bookmarks')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false })
                    .limit(1);

                if (error) throw error;

                if (data && data.length > 0) {
                    const saved = data[0];
                    lastReadSurah.textContent = saved.surah_name;
                    lastReadAyat.textContent = `Ayat ${saved.ayat_no}`;
                    lastReadWidget.classList.remove('hidden');

                    btnContinue.onclick = async () => {
                        await loadSurah(saved.surah_no);
                        setTimeout(() => {
                            const el = document.getElementById(`ayat-${saved.ayat_no}`);
                            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 500);
                    };
                }
            } catch (err) {
                console.error('Gagal memuat bookmark:', err.message);
            }
        }

        // 7. SHARE AYAT (SEKARANG AKTIF)
        function shareAyat(surahName, ayatNo, textArab) {
            const shareText = `Al-Qur'an - ${surahName} Ayat ${ayatNo}:\n\n"${textArab}"\n\nDibagikan via Al-Qur'an Digital`;
            if (navigator.share) {
                navigator.share({ title: `${surahName}:${ayatNo}`, text: shareText, url: window.location.href }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareText);
                alert('Teks ayat berhasil disalin!');
            }
        }

        // 8. APP FUNCTIONS (THEME, SEARCH, LOAD SURAH)
        function initTheme() {
            if (localStorage.theme === 'light') {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').textContent = '🌙';
            } else {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').textContent = '☀️';
            }
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                document.getElementById('themeIcon').textContent = '🌙';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                document.getElementById('themeIcon').textContent = '☀️';
            }
        });

        btnOpenSearch.addEventListener('click', () => {
            searchModal.classList.remove('hidden');
            setTimeout(() => searchInput.focus(), 100);
        });

        function closeSearchModal() {
            searchModal.classList.add('hidden');
            searchInput.value = '';
        }

        async function fetchSurahList() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                allSurahs = data.data;
            } catch (err) {
                console.error(err);
            }
        }

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase().trim();
            if (val === '') return (surahListEl.innerHTML = '');

            const filtered = allSurahs.filter(s => 
                s.englishName.toLowerCase().includes(val) || 
                s.englishNameTranslation.toLowerCase().includes(val) ||
                s.number.toString() === val
            );

            surahListEl.innerHTML = filtered.map(s => `
                <div onclick="selectSurah(${s.number})" class="p-3 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl cursor-pointer flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <span class="w-7 h-7 rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-bold text-xs flex items-center justify-center">
                            ${s.number}
                        </span>
                        <div>
                            <h4 class="font-semibold text-xs">${s.englishName}</h4>
                            <p class="text-[10px] text-slate-400">${s.numberOfAyahs} Ayat</p>
                        </div>
                    </div>
                    <span class="font-arabic text-emerald-600 dark:text-emerald-400 font-semibold">${s.name}</span>
                </div>
            `).join('');
        });

        function selectSurah(surahNo) {
            closeSearchModal();
            loadSurah(surahNo);
            document.getElementById('mainReadArea').scrollIntoView({ behavior: 'smooth' });
        }

        async function loadSurah(surahNo) {
            currentSurahNo = surahNo;
            placeholderView.classList.add('hidden');
            surahHeader.classList.remove('hidden');
            ayatContainer.innerHTML = `<div class="text-center py-16 text-xs text-slate-400">Memuat teks ayat, audio, dan terjemahan...</div>`;

            try {
                const [arabicRes, transRes, audioRes] = await Promise.all([
                    fetch(`https://api.alquran.cloud/v1/surah/${surahNo}`),
                    fetch(`https://api.alquran.cloud/v1/surah/${surahNo}/${selectedLang}`),
                    fetch(`https://api.alquran.cloud/v1/surah/${surahNo}/${selectedQori}`)
                ]);

                const arabicData = await arabicRes.json();
                const transData = await transRes.json();
                const audioData = await audioRes.json();
                const surahInfo = arabicData.data;

                document.getElementById('activeSurahNumber').textContent = `SURAH NO. ${surahInfo.number}`;
                document.getElementById('activeSurahName').textContent = `${surahInfo.englishName} (${surahInfo.name})`;
                document.getElementById('activeSurahTranslation').textContent = `${surahInfo.revelationType} • ${surahInfo.numberOfAyahs} AYAT — ${surahInfo.englishNameTranslation}`;

                if (audioData.data.ayahs.length > 0) {
                    document.getElementById('globalAudioPlayer').src = audioData.data.ayahs[0].audio;
                }

                const combinedAyahs = surahInfo.ayahs.map((a, i) => ({
                    numberInSurah: a.numberInSurah,
                    textArab: a.text,
                    textTrans: transData.data.ayahs[i] ? transData.data.ayahs[i].text : '',
                    audioUrl: audioData.data.ayahs[i] ? audioData.data.ayahs[i].audio : ''
                }));

                renderAyat(combinedAyahs, surahInfo.englishName);
            } catch (err) {
                ayatContainer.innerHTML = `<p class="text-red-400 text-center text-xs">Gagal memuat data ayat.</p>`;
            }
        }

        function renderAyat(ayahs, surahName) {
            ayatContainer.innerHTML = ayahs.map(a => `
                <div id="ayat-${a.numberInSurah}" class="p-4 rounded-2xl border border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/40">
                    <div class="flex justify-between items-center mb-4">
                        <span class="w-7 h-7 rounded-xl bg-emerald-500 text-white font-bold text-xs flex items-center justify-center">${a.numberInSurah}</span>
                        
                        <div class="flex items-center gap-1">
                            <button onclick="saveBookmarkToSupabase(${currentSurahNo}, '${surahName}', ${a.numberInSurah})" 
                                class="px-2.5 py-1 text-slate-400 hover:text-emerald-500 text-xs transition flex items-center gap-1">
                                📌 <span class="hidden sm:inline">Simpan</span>
                            </button>
                            <button onclick="shareAyat('${surahName}', ${a.numberInSurah}, \`${a.textArab}\`)" 
                                class="px-2.5 py-1 text-slate-400 hover:text-emerald-500 text-xs transition flex items-center gap-1">
                                🔗 <span class="hidden sm:inline">Share</span>
                            </button>
                        </div>
                    </div>

                    <div class="text-right font-arabic text-2xl sm:text-3xl mb-4 text-slate-800 dark:text-slate-100 tracking-wide">${a.textArab}</div>
                    <div class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 mb-4">${a.textTrans}</div>

                    <div class="pt-3 border-t border-slate-200/60 dark:border-slate-800/60 flex justify-end">
                        <button onclick="playAudioAyat('${a.audioUrl}')" class="px-3 py-1.5 text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 rounded-xl text-xs font-semibold flex items-center gap-1.5">
                            <span>▶️</span>
                            <span>Putar Audio</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        let activeAudio = null;
        function playAudioAyat(url) {
            if (activeAudio) activeAudio.pause();
            if (!url) return alert('Audio tidak tersedia.');
            activeAudio = new Audio(url);
            activeAudio.play();
        }
    </script>
</body>
</html>
