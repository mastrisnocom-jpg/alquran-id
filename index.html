<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Qur'anul Karim — Tajwid Berwarna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: { 950: '#022c22', 900: '#064e3b', 800: '#065f46', 600: '#059669', 500: '#10b981' },
                        darkBg: '#0b1120', darkCard: '#151e32',
                    }
                }
            }
        }
    </script>

    <!-- SUPABASE JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Scheherazade+New:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS TEMA TAJWID BERWARNA -->
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-arabic { font-family: 'Scheherazade New', serif; line-height: 2.4; }

        /* Pewarnaan Hukum Tajwid */
        tajweed[class*="ham_wasl"] { color: #AAAAAA; }
        tajweed[class*="slnt"] { color: #AAAAAA; }
        tajweed[class*="mdda"] { color: #FF0000; font-weight: bold; } /* Mad */
        tajweed[class*="ghn"] { color: #FF7E00; font-weight: bold; }  /* Ghunnah */
        tajweed[class*="ikhf"] { color: #9400D3; }                   /* Ikhfa */
        tajweed[class*="idgh"] { color: #1E90FF; }                   /* Idgham */
        tajweed[class*="iqlb"] { color: #2E8B57; }                   /* Iqlab */
        tajweed[class*="qlq"] { color: #DD0000; font-weight: bold; } /* Qalqalah */
        
        .legend-item { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; margin-right: 8px; }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-darkBg dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Header Navbar -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-darkCard/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            
            <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.reload()">
                <div class="w-10 h-10 rounded-2xl bg-emerald-500/10 flex items-center justify-center text-emerald-600 font-bold text-xl">📖</div>
                <div>
                    <h1 class="text-lg font-bold leading-tight text-emerald-700 dark:text-emerald-400">Al-Qur'anul Karim</h1>
                    <p class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">Tajwid Berwarna</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Tombol Cari -->
                <button type="button" id="btnSearchToggle" class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center hover:bg-emerald-500 hover:text-white transition">🔍</button>
                
                <!-- Container Auth -->
                <div id="authButtonContainer">
                    <button type="button" onclick="openAuthModal()" class="px-3.5 py-1.5 rounded-full bg-emerald-600 text-white font-semibold text-xs hover:bg-emerald-700 transition">
                        Masuk
                    </button>
                </div>

                <!-- Tombol Dark Mode -->
                <button type="button" id="btnDarkToggle" class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center hover:bg-emerald-500 hover:text-white transition">
                    <span id="themeIcon">☀️</span>
                </button>
            </div>

        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-5 flex-1 w-full space-y-6">

        <!-- KETERANGAN WARNA TAJWID (LEGEND) -->
        <div class="bg-white dark:bg-darkCard p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 text-xs shadow-sm">
            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Panduan Warna Tajwid:</p>
            <div class="flex flex-wrap gap-y-2">
                <span class="legend-item"><span class="legend-dot bg-[#FF0000]"></span> Mad</span>
                <span class="legend-item"><span class="legend-dot bg-[#FF7E00]"></span> Ghunnah</span>
                <span class="legend-item"><span class="legend-dot bg-[#9400D3]"></span> Ikhfa</span>
                <span class="legend-item"><span class="legend-dot bg-[#1E90FF]"></span> Idgham</span>
                <span class="legend-item"><span class="legend-dot bg-[#2E8B57]"></span> Iqlab</span>
                <span class="legend-item"><span class="legend-dot bg-[#DD0000]"></span> Qalqalah</span>
            </div>
        </div>

        <!-- Filter Bahasa & Qori -->
        <div class="flex flex-wrap sm:flex-nowrap items-center justify-between gap-3 bg-white dark:bg-darkCard p-3 rounded-2xl border border-slate-200 dark:border-slate-800 text-xs">
            <div class="flex items-center gap-2 w-full sm:w-auto bg-slate-100 dark:bg-slate-800 px-3 py-2 rounded-xl">
                <span>🌐 Bahasa:</span>
                <select id="langSelect" class="bg-transparent font-medium focus:outline-none cursor-pointer w-full dark:text-white">
                    <option value="id.indonesian" class="dark:bg-darkCard">🇮🇩 Indonesia</option>
                    <option value="en.sahih" class="dark:bg-darkCard">🇬🇧 English</option>
                </select>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto bg-slate-100 dark:bg-slate-800 px-3 py-2 rounded-xl">
                <span>🎙️ Qori:</span>
                <select id="qoriSelect" class="bg-transparent font-medium focus:outline-none cursor-pointer w-full dark:text-white">
                    <option value="ar.alafasy" class="dark:bg-darkCard">Mishary Rashid Alafasy</option>
                    <option value="ar.abdurrahmaanasassudais" class="dark:bg-darkCard">Abdurrahman As-Sudais</option>
                </select>
            </div>
        </div>

        <!-- Area Baca Surah -->
        <section id="mainReadArea">
            <div id="surahDetail" class="bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-800 p-4 sm:p-6 min-h-[400px]">
                <div id="placeholderView" class="text-center py-16 text-slate-400">
                    <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-emerald-500/10 flex items-center justify-center text-3xl">🔍</div>
                    <p class="text-xs font-medium">Klik tombol <span class="text-emerald-600 font-bold cursor-pointer" id="btnSearchPlaceholder">Cari 🔍</span> di atas untuk memilih Surah.</p>
                </div>

                <div id="surahHeader" class="hidden mb-6 text-center pb-6 border-b border-slate-200 dark:border-slate-800">
                    <span id="activeSurahNumber" class="text-[11px] font-bold px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-600 border border-emerald-500/20">SURAH NO. -</span>
                    <h2 id="activeSurahName" class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-slate-100 mt-2"></h2>
                    <p id="activeSurahTranslation" class="text-xs text-slate-500 dark:text-slate-400 mt-1"></p>
                    <div class="mt-4 flex justify-center">
                        <audio id="globalAudioPlayer" controls class="w-full max-w-md h-9 rounded-xl"></audio>
                    </div>
                </div>

                <div id="ayatContainer" class="space-y-6"></div>
            </div>
        </section>
    </main>

    <!-- MODAL SEARCH -->
    <div id="searchModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-start justify-center pt-16 px-4 hidden">
        <div class="bg-white dark:bg-darkCard w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
            <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                <input type="text" id="searchInput" placeholder="Ketik nama/nomor surah (misal: Yasin, 36)..." class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border-none focus:outline-none text-xs dark:text-white">
                <button type="button" id="btnCloseSearch" class="text-xs font-semibold px-3 py-2 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">Batal</button>
            </div>
            <div id="surahList" class="p-2 max-h-[60vh] overflow-y-auto space-y-1"></div>
        </div>
    </div>

    <!-- MODAL AUTH (POP-UP LOGIN) -->
    <div id="authModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-darkCard w-full max-w-md rounded-2xl p-6 shadow-2xl border border-slate-200 dark:border-slate-800">
            <div class="flex justify-between items-center mb-4">
                <h3 id="authModalTitle" class="text-base font-bold text-emerald-600 dark:text-emerald-400">Masuk ke Akun</h3>
                <button type="button" id="btnCloseAuth" class="text-slate-400 text-lg hover:text-slate-600 dark:hover:text-slate-200">✕</button>
            </div>

            <div id="authMsg" class="hidden mb-3 p-2.5 rounded-xl text-xs font-medium text-center"></div>

            <form id="authForm" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">Email</label>
                    <input type="email" id="authEmail" required placeholder="nama@email.com" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border-none focus:ring-2 focus:ring-emerald-500 text-xs dark:text-white">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">Password</label>
                    <input type="password" id="authPassword" required placeholder="••••••••" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border-none focus:ring-2 focus:ring-emerald-500 text-xs dark:text-white">
                </div>

                <button type="submit" id="btnAuthSubmit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-xs transition mt-2">
                    Masuk
                </button>
            </form>

            <div class="mt-4 text-center text-xs text-slate-400">
                <span id="authToggleText">Belum punya akun?</span>
                <button type="button" id="btnToggleAuth" class="text-emerald-600 dark:text-emerald-400 font-semibold ml-1 underline">
                    Daftar Akun Baru
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT MASTER -->
    <script>
        // 1. SUPABASE CLIENT SAFE INIT
        const SUPABASE_URL = 'https://hsiguoieyyracptyzihn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzaWd1b2lleXlyYWNwdHl6aWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NzI3MTAsImV4cCI6MjEwMTA0ODcxMH0.RQcIUbyYFrZJVj4H_aoJ6VytKgMDFeydZzJDCwWfysc';

        let supabase = null;
        try {
            if (window.supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn("Supabase SDK gagal dipanggil:", e);
        }

        // 2. FUNGSI UTAMA MODAL LOGIN/LOGOUT GLOBAL (Diisolasi agar langsung aktif)
        const authModal = document.getElementById('authModal');
        
        window.openAuthModal = function() {
            document.getElementById('authMsg').classList.add('hidden');
            authModal.classList.remove('hidden');
        };

        document.getElementById('btnCloseAuth').onclick = function() {
            authModal.classList.add('hidden');
        };

        let isRegisterMode = false;
        document.getElementById('btnToggleAuth').onclick = function() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('authMsg').classList.add('hidden');
            document.getElementById('authModalTitle').textContent = isRegisterMode ? 'Daftar Akun Baru' : 'Masuk ke Akun';
            document.getElementById('btnAuthSubmit').textContent = isRegisterMode ? 'Daftar' : 'Masuk';
            document.getElementById('authToggleText').textContent = isRegisterMode ? 'Sudah punya akun?' : 'Belum punya akun?';
            document.getElementById('btnToggleAuth').textContent = isRegisterMode ? 'Masuk di sini' : 'Daftar Akun Baru';
        };

        // Render Tombol UI Auth (Masuk / Keluar)
        function renderUserAuthUI(user) {
            const container = document.getElementById('authButtonContainer');
            if (user) {
                const emailShort = user.email ? user.email.split('@')[0] : 'User';
                container.innerHTML = `
                    <div class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 p-1 pl-2.5 rounded-full border border-slate-200 dark:border-slate-700">
                        <span class="text-[11px] font-semibold text-slate-700 dark:text-slate-300 max-w-[80px] sm:max-w-[120px] truncate">
                            👤 ${emailShort}
                        </span>
                        <button type="button" onclick="handleLogout()" class="px-2.5 py-1 rounded-full bg-red-500 hover:bg-red-600 text-white font-semibold text-[11px] transition shadow-sm">
                            Keluar
                        </button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <button type="button" onclick="openAuthModal()" class="px-3.5 py-1.5 rounded-full bg-emerald-600 text-white font-semibold text-xs hover:bg-emerald-700 transition">
                        Masuk
                    </button>
                `;
            }
        }

        // Handle Submit Login / Register
        document.getElementById('authForm').onsubmit = async function(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const msgEl = document.getElementById('authMsg');
            const btnSubmit = document.getElementById('btnAuthSubmit');

            btnSubmit.disabled = true;
            btnSubmit.textContent = "Memproses...";
            msgEl.classList.add('hidden');

            try {
                if (supabase) {
                    if (isRegisterMode) {
                        const { error } = await supabase.auth.signUp({ email, password });
                        if (error) throw error;
                        alert("Pendaftaran berhasil! Silakan langsung login.");
                        document.getElementById('btnToggleAuth').click();
                    } else {
                        const { error, data } = await supabase.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                        renderUserAuthUI(data.user);
                        authModal.classList.add('hidden');
                    }
                } else {
                    const userObj = { email: email };
                    localStorage.setItem('local_quran_user', JSON.stringify(userObj));
                    renderUserAuthUI(userObj);
                    authModal.classList.add('hidden');
                }
            } catch (err) {
                msgEl.textContent = err.message || "Gagal masuk. Periksa kembali email dan password Anda.";
                msgEl.className = "p-2.5 rounded-xl text-xs font-medium text-center mb-3 bg-red-500/10 text-red-500 border border-red-500/20";
                msgEl.classList.remove('hidden');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = isRegisterMode ? 'Daftar' : 'Masuk';
            }
        };

        window.handleLogout = async function() {
            if (confirm("Apakah Anda yakin ingin keluar?")) {
                if (supabase) {
                    await supabase.auth.signOut();
                }
                localStorage.removeItem('local_quran_user');
                renderUserAuthUI(null);
            }
        };

        // Cek Sesi Saja
        async function initAuthSession() {
            if (supabase) {
                try {
                    const { data: { session } } = await supabase.auth.getSession();
                    renderUserAuthUI(session ? session.user : null);

                    supabase.auth.onAuthStateChange((_event, session) => {
                        renderUserAuthUI(session ? session.user : null);
                    });
                } catch(e) {
                    console.warn(e);
                }
            } else {
                const localUser = localStorage.getItem('local_quran_user');
                if (localUser) renderUserAuthUI(JSON.parse(localUser));
            }
        }
        initAuthSession();

        // 3. CONTROL SEARCH & DARK MODE
        const searchModal = document.getElementById('searchModal');
        const searchInput = document.getElementById('searchInput');

        document.getElementById('btnDarkToggle').onclick = function() {
            document.documentElement.classList.toggle('dark');
            document.getElementById('themeIcon').textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
        };

        function showSearch() {
            searchModal.classList.remove('hidden');
            if (window.allSurahs) renderSurahSearchList(window.allSurahs);
            setTimeout(() => searchInput.focus(), 100);
        }

        document.getElementById('btnSearchToggle').onclick = showSearch;
        document.getElementById('btnSearchPlaceholder').onclick = showSearch;
        document.getElementById('btnCloseSearch').onclick = function() {
            searchModal.classList.add('hidden');
            searchInput.value = '';
        };

        // 4. API & SURAH LOAD
        window.allSurahs = [];
        let currentSurahNo = null;
        let selectedLang = 'id.indonesian';
        let selectedQori = 'ar.alafasy';

        async function fetchSurahs() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                window.allSurahs = data.data;
            } catch (err) {
                console.error("Gagal API Surah:", err);
            }
        }
        fetchSurahs();

        searchInput.oninput = function(e) {
            const val = e.target.value.toLowerCase().trim();
            if (!val) return renderSurahSearchList(window.allSurahs);
            const filtered = window.allSurahs.filter(s => 
                s.englishName.toLowerCase().includes(val) || 
                s.englishNameTranslation.toLowerCase().includes(val) ||
                s.number.toString() === val
            );
            renderSurahSearchList(filtered);
        };

        function renderSurahSearchList(list) {
            const surahListEl = document.getElementById('surahList');
            if (!list || list.length === 0) {
                surahListEl.innerHTML = `<div class="text-center py-6 text-xs text-slate-400">Surah tidak ditemukan.</div>`;
                return;
            }
            surahListEl.innerHTML = list.map(s => `
                <div onclick="selectSurah(${s.number})" class="p-3 hover:bg-slate-100 dark:hover:bg-slate-800/80 rounded-xl cursor-pointer transition flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <span class="w-7 h-7 rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-bold text-xs flex items-center justify-center">${s.number}</span>
                        <div>
                            <h4 class="font-semibold text-xs text-slate-800 dark:text-slate-100">${s.englishName}</h4>
                            <p class="text-[10px] text-slate-400">${s.englishNameTranslation} • ${s.numberOfAyahs} Ayat</p>
                        </div>
                    </div>
                    <span class="font-arabic text-emerald-600 dark:text-emerald-400 font-semibold">${s.name}</span>
                </div>
            `).join('');
        }

        window.selectSurah = function(surahNo) {
            searchModal.classList.add('hidden');
            searchInput.value = '';
            loadSurah(surahNo);
            document.getElementById('mainReadArea').scrollIntoView({ behavior: 'smooth' });
        };

        async function loadSurah(surahNo) {
            currentSurahNo = surahNo;
            document.getElementById('placeholderView').classList.add('hidden');
            document.getElementById('surahHeader').classList.remove('hidden');
            const ayatContainer = document.getElementById('ayatContainer');
            ayatContainer.innerHTML = `<div class="text-center py-16 text-xs text-slate-400">Memuat teks tajwid, audio, dan terjemahan...</div>`;

            try {
                const [arabicRes, transRes, audioRes] = await Promise.all([
                    fetch(`https://api.alquran.cloud/v1/surah/${surahNo}/quran-tajweed`),
                    fetch(`https://api.alquran.cloud/v1/surah/${surahNo}/${selectedLang}`),
                    fetch(`https://api.alquran.cloud/v1/surah/${surahNo}/${selectedQori}`)
                ]);

                const arabicData = await arabicRes.json();
                const transData = await transRes.json();
                const audioData = await audioRes.json();
                const surahInfo = arabicData.data;

                document.getElementById('activeSurahNumber').textContent = `SURAH NO. ${surahInfo.number}`;
                document.getElementById('activeSurahName').textContent = `${surahInfo.englishName} (${surahInfo.name})`;
                document.getElementById('activeSurahTranslation').textContent = `${surahInfo.revelationType} • ${surahInfo.numberOfAyahs} AYAT`;

                if (audioData.data.ayahs.length > 0) {
                    document.getElementById('globalAudioPlayer').src = audioData.data.ayahs[0].audio;
                }

                const combinedAyahs = surahInfo.ayahs.map((a, i) => ({
                    numberInSurah: a.numberInSurah,
                    textArabTajweed: a.text,
                    textTrans: transData.data.ayahs[i] ? transData.data.ayahs[i].text : '',
                    audioUrl: audioData.data.ayahs[i] ? audioData.data.ayahs[i].audio : ''
                }));

                renderAyat(combinedAyahs, surahInfo.englishName);
            } catch (err) {
                ayatContainer.innerHTML = `<p class="text-red-400 text-center text-xs">Gagal memuat ayat.</p>`;
            }
        }

        function renderAyat(ayahs, surahName) {
            document.getElementById('ayatContainer').innerHTML = ayahs.map(a => `
                <div id="ayat-${a.numberInSurah}" class="p-4 rounded-2xl border border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/40">
                    <div class="flex justify-between items-center mb-4">
                        <span class="w-7 h-7 rounded-xl bg-emerald-500 text-white font-bold text-xs flex items-center justify-center">${a.numberInSurah}</span>
                        <div class="flex items-center gap-1">
                            <button onclick="shareAyat('${surahName}', ${a.numberInSurah})" 
                                class="px-2.5 py-1 text-slate-400 hover:text-emerald-500 text-xs transition flex items-center gap-1">
                                🔗 <span class="hidden sm:inline">Share</span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="text-right font-arabic text-2xl sm:text-3xl mb-4 text-slate-800 dark:text-slate-100 tracking-wide">
                        ${a.textArabTajweed}
                    </div>

                    <div class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 mb-4">${a.textTrans}</div>
                    
                    <div class="pt-3 border-t border-slate-200/60 dark:border-slate-800/60 flex justify-end">
                        <button onclick="playAudioAyat('${a.audioUrl}')" class="px-3 py-1.5 text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 rounded-xl text-xs font-semibold flex items-center gap-1.5">
                            <span>▶️</span>
                            <span>Putar Audio</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        let activeAudio = null;
        window.playAudioAyat = function(url) {
            if (activeAudio) activeAudio.pause();
            if (!url) return alert('Audio tidak tersedia.');
            activeAudio = new Audio(url);
            activeAudio.play();
        };

        window.shareAyat = function(surahName, ayatNo) {
            const shareText = `Al-Qur'an - ${surahName} Ayat ${ayatNo}`;
            if (navigator.share) {
                navigator.share({ title: `${surahName}:${ayatNo}`, text: shareText, url: window.location.href }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareText);
                alert('Teks disalin!');
            }
        };
    </script>
</body>
</html>
