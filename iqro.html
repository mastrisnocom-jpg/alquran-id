<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Iqro Digital 1–6 — Al-Qur'an App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: { 950: '#022c22', 900: '#064e3b', 800: '#065f46', 600: '#059669', 500: '#10b981', 100: '#d1fae5', 50: '#f0fdf4' },
                        darkBg: '#0b1120', darkCard: '#151e32'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Scheherazade+New:wght@600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-arabic { font-family: 'Scheherazade New', serif; direction: rtl; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-darkBg dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col pb-12">

    <header class="sticky top-0 z-40 bg-white/90 dark:bg-darkCard/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-bold text-xl flex items-center justify-center">📚</div>
                <div>
                    <h1 class="text-lg font-bold text-emerald-700 dark:text-emerald-400">Buku Iqro Digital</h1>
                    <p class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">Jilid 1 Sampai 6</p>
                </div>
            </a>
            <a href="/index.html" class="px-3.5 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs shadow hover:bg-emerald-700 transition">📗 Baca Al-Qur'an</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-5 flex-1 w-full space-y-6">

        <!-- PILIH JILID -->
        <div class="bg-white dark:bg-darkCard p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 shadow-sm">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 text-center">Pilih Jilid Iqro</h3>
            <div class="grid grid-cols-3 sm:grid-cols-6 gap-2" id="jilidBtnContainer">
                <button onclick="selectJilid(1)" id="btnJ1" class="jilid-btn p-3 rounded-xl bg-emerald-600 text-white font-bold text-sm shadow">Iqro 1</button>
                <button onclick="selectJilid(2)" id="btnJ2" class="jilid-btn p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm border border-slate-200 dark:border-slate-700 hover:bg-emerald-500 hover:text-white transition">Iqro 2</button>
                <button onclick="selectJilid(3)" id="btnJ3" class="jilid-btn p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm border border-slate-200 dark:border-slate-700 hover:bg-emerald-500 hover:text-white transition">Iqro 3</button>
                <button onclick="selectJilid(4)" id="btnJ4" class="jilid-btn p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm border border-slate-200 dark:border-slate-700 hover:bg-emerald-500 hover:text-white transition">Iqro 4</button>
                <button onclick="selectJilid(5)" id="btnJ5" class="jilid-btn p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm border border-slate-200 dark:border-slate-700 hover:bg-emerald-500 hover:text-white transition">Iqro 5</button>
                <button onclick="selectJilid(6)" id="btnJ6" class="jilid-btn p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm border border-slate-200 dark:border-slate-700 hover:bg-emerald-500 hover:text-white transition">Iqro 6</button>
            </div>
        </div>

        <!-- IQRO BOARD / VIEWER -->
        <div class="bg-white dark:bg-darkCard rounded-2xl border border-slate-200/80 dark:border-slate-800/80 p-5 space-y-5 shadow-sm">
            <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-3">
                <div>
                    <h2 id="iqroHeaderTitle" class="font-bold text-base text-emerald-600 dark:text-emerald-400">Iqro 1 — Halaman 1</h2>
                    <p id="iqroHeaderDesc" class="text-xs text-slate-400">Pengenalan Huruf Hijaiyah Berharakat Fathah (A - Ba)</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="changePage(-1)" class="px-3.5 py-1.5 bg-slate-100 dark:bg-slate-800 rounded-xl font-bold text-xs hover:bg-emerald-500 hover:text-white transition">← Prev</button>
                    <button onclick="changePage(1)" class="px-3.5 py-1.5 bg-emerald-600 text-white rounded-xl font-bold text-xs hover:bg-emerald-700 transition shadow">Next →</button>
                </div>
            </div>

            <!-- GRID MATERI TEKS ARAB -->
            <div id="iqroContentGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4 min-h-[300px] p-2">
                <!-- Konten dinamis dirender lewat JS -->
            </div>
        </div>

    </main>

    <script>
        // DATABASE MATERI IQRO TEKS INTERAKTIF
        const iqroDatabase = {
            1: [
                { page: 1, title: "Huruf أ (A) dan ب (BA)", items: ["أَ", "بَ", "أَ بَ", "بَ أَ", "أَ أَ", "بَ بَ", "أَ بَ أَ", "بَ أَ بَ", "أَ أَ بَ", "بَ بَ أَ"] },
                { page: 2, title: "Pengenalan Huruf ت (TA)", items: ["تَ", "أَ تَ", "بَ تَ", "تَ أَ بَ", "أَ بَ تَ", "بَ تَ أَ", "تَ بَ أَ", "أَ تَ بَ", "تَ تَ أَ", "بَ تَ تَ"] },
                { page: 3, title: "Pengenalan Huruf ث (TSA)", items: ["ثَ", "تَ ثَ", "أَ ثَ", "ثَ بَ تَ", "أَ بَ تَ ثَ", "ثَ أَ بَ", "تَ ثَ بَ", "بَ ثَ تَ", "ثَ ثَ أَ", "تَ ثَ ثَ"] },
                { page: 4, title: "Pengenalan Huruf ج (JA)", items: ["جَ", "أَ جَ", "بَ جَ", "جَ تَ ثَ", "أَ بَ تَ ثَ جَ", "جَ أَ بَ", "تَ جَ ثَ", "جَ ثَ بَ", "ثَ جَ تَ", "أَ جَ ثَ"] }
            ],
            2: [
                { page: 1, title: "Iqro 2: Huruf Sambung Awal", items: ["بَـ", "تَـ", "ثَـ", "بَـتَ", "تَـثَ", "بَـثَ", "بَـتَـثَ", "تَـبَـثَ"] }
            ]
        };

        let currentJilid = 1;
        let currentPageIndex = 0;

        function selectJilid(j) {
            currentJilid = j;
            currentPageIndex = 0;

            document.querySelectorAll('.jilid-btn').forEach(b => b.className = "jilid-btn p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm border border-slate-200 dark:border-slate-700 hover:bg-emerald-500 hover:text-white transition");
            document.getElementById(`btnJ${j}`).className = "jilid-btn p-3 rounded-xl bg-emerald-600 text-white font-bold text-sm shadow";

            renderIqroPage();
        }

        function changePage(dir) {
            const list = iqroDatabase[currentJilid] || iqroDatabase[1];
            if (currentPageIndex + dir >= 0 && currentPageIndex + dir < list.length) {
                currentPageIndex += dir;
                renderIqroPage();
            }
        }

        function renderIqroPage() {
            const list = iqroDatabase[currentJilid] || iqroDatabase[1];
            const data = list[currentPageIndex] || list[0];

            document.getElementById('iqroHeaderTitle').textContent = `Iqro ${currentJilid} — Halaman ${data.page}`;
            document.getElementById('iqroHeaderDesc').textContent = data.title;

            const grid = document.getElementById('iqroContentGrid');
            grid.innerHTML = data.items.map(item => `
                <div class="p-6 bg-slate-50 dark:bg-slate-900/60 rounded-2xl border border-slate-200/80 dark:border-slate-800 flex items-center justify-center hover:border-emerald-500 transition shadow-sm">
                    <span class="font-arabic text-4xl sm:text-5xl text-slate-800 dark:text-slate-100 tracking-wider">${item}</span>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', renderIqroPage);
    </script>
</body>
</html>
