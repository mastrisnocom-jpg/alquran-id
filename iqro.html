<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Iqro 1-6 Asli PDF — Al-Qur'an Digital</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            950: '#022c22',
                            900: '#064e3b',
                            800: '#065f46',
                            600: '#059669',
                            500: '#10b981',
                            100: '#d1fae5',
                            50: '#f0fdf4',
                        },
                        darkBg: '#0b1120',
                        darkCard: '#151e32',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.3); border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-darkBg dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- HEADER NAVBAR -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-darkCard/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-emerald-500/10 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 font-bold text-xl flex items-center justify-center">
                    📚
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight tracking-tight text-emerald-700 dark:text-emerald-400">
                        Buku Iqro 1–6 (PDF)
                    </h1>
                    <p class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">Cara Cepat Belajar Membaca Al-Qur'an</p>
                </div>
            </a>

            <div class="flex items-center gap-2">
                <a href="/index.html" class="px-3.5 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs shadow hover:bg-emerald-700 transition">
                    📗 Baca Al-Qur'an
                </a>
                <button id="themeToggle" class="w-10 h-10 rounded-full bg-emerald-500/10 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-center hover:bg-emerald-500 hover:text-white transition shadow-sm">
                    <span id="themeIcon">☀️</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN VIEWER PDF -->
    <main class="max-w-5xl mx-auto px-2 sm:px-4 py-4 flex-1 w-full flex flex-col space-y-3">
        
        <!-- CONTROL BAR & LINK DOWNLOAD -->
        <div class="bg-white dark:bg-darkCard p-3 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
            <div class="flex items-center gap-2 text-slate-600 dark:text-slate-300 font-medium">
                <span>📖 Tampilan PDF Buku Cetak Asli (K.H. As'ad Humam)</span>
            </div>

            <a href="https://dn760008.eu.archive.org/0/items/humam-2000-buku-iqro-cara-cepat-belajar-membaca-al-quran-1-6/Humam%20-%202000%20-%20Buku%20Iqro%27%20Cara%20Cepat%20Belajar%20Membaca%20Al-Qur%27an_1-6.pdf" 
               target="_blank" 
               download 
               class="px-3.5 py-1.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 font-bold transition flex items-center gap-1.5">
                <span>📥</span> Download PDF
            </a>
        </div>

        <!-- CONTAINER IFRAME PDF VIEWER -->
        <div class="bg-white dark:bg-darkCard rounded-2xl border border-slate-200/80 dark:border-slate-800/80 overflow-hidden shadow-lg flex-1 min-h-[75vh]">
            <iframe 
                src="https://dn760008.eu.archive.org/0/items/humam-2000-buku-iqro-cara-cepat-belajar-membaca-al-quran-1-6/Humam%20-%202000%20-%20Buku%20Iqro%27%20Cara%20Cepat%20Belajar%20Membaca%20Al-Qur%27an_1-6.pdf#toolbar=1&navpanes=0&scrollbar=1" 
                class="w-full h-full min-h-[75vh] border-none"
                title="Buku Iqro 1-6 PDF">
                <p class="p-6 text-center text-xs text-slate-400">
                    Browser Anda tidak mendukung pratinjau PDF langsung. 
                    <a href="https://dn760008.eu.archive.org/0/items/humam-2000-buku-iqro-cara-cepat-belajar-membaca-al-quran-1-6/Humam%20-%202000%20-%20Buku%20Iqro%27%20Cara%20Cepat%20Belajar%20Membaca%20Al-Qur%27an_1-6.pdf" class="text-emerald-500 underline font-bold">Klik di sini untuk mengunduh PDF Iqro</a>.
                </p>
            </iframe>
        </div>

    </main>

    <!-- JAVASCRIPT LOGIC THEME -->
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
        });

        function initTheme() {
            if (localStorage.theme === 'light') {
                document.documentElement.classList.remove('dark');
                themeIcon.textContent = '🌙';
            } else {
                document.documentElement.classList.add('dark');
                themeIcon.textContent = '☀️';
            }
        }

        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                themeIcon.textContent = '🌙';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                themeIcon.textContent = '☀️';
            }
        });
    </script>
</body>
</html>
