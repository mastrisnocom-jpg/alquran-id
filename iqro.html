<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Iqro Digital 1–6 — Al-Qur'an App</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            950: '#022c22',
                            900: '#064e3b',
                            800: '#065f46',
                            600: '#059669',
                            500: '#10b981',
                            100: '#d1fae5',
                            50: '#f0fdf4',
                        },
                        darkBg: '#0b1120',
                        darkCard: '#151e32',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.3); border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-darkBg dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col pb-12">

    <!-- HEADER / NAVBAR -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-darkCard/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800/80 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-emerald-500/10 dark:bg-emerald-500/20 flex items-center justify-center text-emerald-600 dark:text-emerald-400 font-bold text-xl">
                    📚
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight tracking-tight text-emerald-700 dark:text-emerald-400">
                        Buku Iqro Digital
                    </h1>
                    <p class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">Jilid 1 sampai 6</p>
                </div>
            </a>

            <div class="flex items-center gap-2">
                <a href="/index.html" class="px-3.5 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs shadow hover:bg-emerald-700 transition">
                    📗 Baca Al-Qur'an
                </a>
                <button id="themeToggle" class="w-10 h-10 rounded-full bg-emerald-500/10 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-center hover:bg-emerald-500 hover:text-white transition shadow-sm">
                    <span id="themeIcon">☀️</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-4xl mx-auto px-4 py-5 flex-1 w-full space-y-6">

        <!-- NAVIGASI PILIH JILID IQRO (1-6) -->
        <div class="bg-white dark:bg-darkCard p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 shadow-sm">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 text-center">Pilih Jilid Iqro</h3>
            <div class="grid grid-cols-3 sm:grid-cols-6 gap-2" id="jilidBtnContainer">
                <button onclick="loadIqroJilid(1)" id="btnJilid1" class="iqro-jilid-btn p-3 rounded-xl bg-emerald-600 text-white font-bold text-sm shadow transition">Iqro 1</button>
                <button onclick="loadIqroJilid(2)" id="btnJilid2" class="iqro-jilid-btn p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm border border-slate-200 dark:border-slate-700 hover:bg-emerald-500 hover:text-white transition">Iqro 2</button>
                <button onclick="loadIqroJilid(3)" id="btnJilid3" class="iqro-jilid-btn p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm border border-slate-200 dark:border-slate-700 hover:bg-emerald-500 hover:text-white transition">Iqro 3</button>
                <button onclick="loadIqroJilid(4)" id="btnJilid4" class="iqro-jilid-btn p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm border border-slate-200 dark:border-slate-700 hover:bg-emerald-500 hover:text-white transition">Iqro 4</button>
                <button onclick="loadIqroJilid(5)" id="btnJilid5" class="iqro-jilid-btn p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm border border-slate-200 dark:border-slate-700 hover:bg-emerald-500 hover:text-white transition">Iqro 5</button>
                <button onclick="loadIqroJilid(6)" id="btnJilid6" class="iqro-jilid-btn p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm border border-slate-200 dark:border-slate-700 hover:bg-emerald-500 hover:text-white transition">Iqro 6</button>
            </div>
        </div>

        <!-- VIEWER HALAMAN IQRO -->
        <div class="bg-white dark:bg-darkCard rounded-2xl border border-slate-200/80 dark:border-slate-800/80 p-4 text-center space-y-4 shadow-sm">
            <div class="flex justify-between items-center px-2">
                <span id="iqroTitle" class="font-bold text-sm text-emerald-600 dark:text-emerald-400">📖 Iqro 1 — Halaman 1</span>
                
                <div class="flex items-center gap-2">
                    <button onclick="prevIqroPage()" class="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-xs hover:bg-emerald-500 hover:text-white transition shadow-sm">
                        ← Prev
                    </button>
                    <button onclick="nextIqroPage()" class="px-3.5 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs hover:bg-emerald-700 transition shadow-sm">
                        Next →
                    </button>
                </div>
            </div>

            <!-- CONTAINER BUKU IQRO -->
            <div class="min-h-[420px] flex items-center justify-center bg-slate-50 dark:bg-slate-900/50 rounded-xl p-3 border border-slate-100 dark:border-slate-800 overflow-hidden relative">
                <img id="iqroPageImage" src="https://iqro-cdn.pages.dev/iqro1/page-1.jpg" onerror="handleIqroImgError(this)" alt="Buku Iqro Digital" class="max-h-[650px] w-auto mx-auto rounded-lg shadow-md object-contain">
            </div>
        </div>

    </main>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let currentIqroJilid = 1;
        let currentIqroPage = 1;
        const maxPagesPerJilid = { 1: 32, 2: 32, 3: 32, 4: 32, 5: 32, 6: 32 };

        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
        });

        function initTheme() {
            if (localStorage.theme === 'light') {
                document.documentElement.classList.remove('dark');
                themeIcon.textContent = '🌙';
            } else {
                document.documentElement.classList.add('dark');
                themeIcon.textContent = '☀️';
            }
        }

        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                themeIcon.textContent = '🌙';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                themeIcon.textContent = '☀️';
            }
        });

        function loadIqroJilid(jilid) {
            currentIqroJilid = jilid;
            currentIqroPage = 1;

            // Highlight Active Button Jilid
            document.querySelectorAll('.iqro-jilid-btn').forEach(btn => {
                btn.className = "iqro-jilid-btn p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-sm border border-slate-200 dark:border-slate-700 hover:bg-emerald-500 hover:text-white transition";
            });
            document.getElementById(`btnJilid${jilid}`).className = "iqro-jilid-btn p-3 rounded-xl bg-emerald-600 text-white font-bold text-sm shadow transition";

            updateIqroView();
        }

        function nextIqroPage() {
            if (currentIqroPage < maxPagesPerJilid[currentIqroJilid]) {
                currentIqroPage++;
                updateIqroView();
            }
        }

        function prevIqroPage() {
            if (currentIqroPage > 1) {
                currentIqroPage--;
                updateIqroView();
            }
        }

        function updateIqroView() {
            document.getElementById('iqroTitle').textContent = `📖 Iqro ${currentIqroJilid} — Halaman ${currentIqroPage}`;
            const imgEl = document.getElementById('iqroPageImage');
            imgEl.src = `https://iqro-cdn.pages.dev/iqro${currentIqroJilid}/page-${currentIqroPage}.jpg`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleIqroImgError(img) {
            img.src = `https://placehold.co/400x600/064e3b/ffffff?text=Iqro+${currentIqroJilid}+-+Halaman+${currentIqroPage}`;
        }
    </script>
</body>
</html>
